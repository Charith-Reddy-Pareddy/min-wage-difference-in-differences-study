name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - uses: r-lib/actions/setup-renv@v2

      - name: Parse-check every R script
        run: |
          Rscript -e '
            files <- list.files("R", pattern = "\\.R$", full.names = TRUE)
            errors <- Filter(Negate(is.null), lapply(files, function(f) {
              result <- tryCatch({ parse(f); NULL }, error = function(e) paste(f, "-", conditionMessage(e)))
              result
            }))
            if (length(errors) > 0) {
              cat(paste(unlist(errors), collapse = "\n"), "\n")
              quit(status = 1)
            }
            cat("All", length(files), "R scripts parse cleanly.\n")
          '

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Validate citation metadata
        run: ruby scripts/check_citation.rb

      - name: Verify Makefile/tests stay in sync with R/
        run: Rscript scripts/check_pipeline_sync.R

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests")'

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e ".[dev,api]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Run tests with coverage
        run: python -m pytest --cov=minwage --cov-report=term-missing

      - name: Verify the package builds
        run: |
          pip install build
          python -m build

  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --tag minwage-tests --file python/Dockerfile python

      - name: Run tests inside the image
        run: docker run --rm --network none minwage-tests python -m pytest --cov=minwage --cov-report=term-missing

  # The full pipeline needs a live IPUMS_API_KEY (R/03) and several
  # minutes of network calls (FRED, QCEW, IPUMS), and reports/final_report.Rmd
  # reads data/processed/ and reports/figures/, both gitignored and not
  # regenerated here. Running the pipeline and rendering the report end to
  # end is a local `make all` / `make report` step (see README.md), not a
  # CI job -- this workflow validates that the code is correct, not that
  # the live data pull still works.
