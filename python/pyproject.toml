[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minwage"
version = "0.1.0"
description = "ML/NN predictive-comparison extension for the minimum-wage DiD study (independent replication of R/27-R/28)"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "torch==2.14.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "build==1.6.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["minwage"]

[tool.coverage.report]
fail_under = 90
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/minwage"]
ignore_missing_imports = true
disallow_untyped_defs = true
